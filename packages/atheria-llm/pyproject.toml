[project]
name = "atheria-llm"
version = "0.2.0"
description = "Atheria LLM — provider-agnostic inference layer (Bedrock, Gemini)"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.0",
    "structlog>=24.1.0",
    "tenacity>=8.3.0",
]

[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["atheria_llm*"]
